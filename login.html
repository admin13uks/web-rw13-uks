FdarF<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login RW 013</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#16a34a,#22c55e);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:#fff;
  padding:40px;
  border-radius:15px;
  width:350px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  text-align:center;
  position:relative;
}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ddd;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#15803d;
}
.link{
  margin-top:15px;
  font-size:13px;
  cursor:pointer;
  color:#16a34a;
}

/* Tombol Beranda */
.beranda{
  position:absolute;
  top:15px;
  left:15px;
  background:#e5e7eb;
  color:#111;
  padding:6px 12px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
}
.beranda:hover{
  background:#d1d5db;
}
</style>
</head>
<body>

<div class="card">

  <!-- Tombol Beranda -->
  <a href="index.html" class="beranda">← Beranda</a>

  <h2>Login Admin</h2>

  <input type="email" id="email" placeholder="Masukkan Email">
  <input type="password" id="password" placeholder="Masukkan Password">

  <button onclick="login()">Login</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5XkibU-ei072xcQ4ZN4D4tK-PVRrxucA",
  authDomain: "rw13-uks.firebaseapp.com",
  projectId: "rw13-uks",
  storageBucket: "rw13-uks.firebasestorage.app",
  messagingSenderId: "500710465344",
  appId: "1:500710465344:web:eb1c89900edfd5925924a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth,email,password)
  .then(()=>{
    window.location.href="form.html";
  })
  .catch(error=>{
    alert("Login gagal: " + error.message);
  });
}

window.register = function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth,email,password)
  .then(()=>{
    alert("Akun berhasil dibuat!");
  })
  .catch(error=>{
    alert(error.message);
  });
}

window.resetPassword = function(){
  const email = document.getElementById("email").value;
  if(!email){
    alert("Masukkan email terlebih dahulu");
    return;
  }
  sendPasswordResetEmail(auth,email)
  .then(()=> alert("Link reset password dikirim ke email"))
  .catch(error=> alert(error.message));
}
</script>

</body>
</html>
