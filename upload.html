<!DOCTYPE html>
<html>
<head>
  <title>Upload Dokumentasi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "ISI_API_KEY_ANDA",
      authDomain: "ISI_AUTH_DOMAIN",
      projectId: "ISI_PROJECT_ID",
      storageBucket: "ISI_STORAGE_BUCKET",
      messagingSenderId: "ISI_SENDER_ID",
      appId: "ISI_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    window.upload = async function(){

      const kategori = ["lingkungan","kesehatan","sosial","keamanan","banksampah"];

      for (let k of kategori){
        const file = document.getElementById(k).files[0];
        if(file){
          const storageRef = ref(storage, k + "/" + Date.now() + "_" + file.name);
          await uploadBytes(storageRef, file);
        }
      }

      alert("Upload berhasil!");
    }
  </script>

  <style>
    body{font-family:Arial; padding:30px;}
    input{margin:10px 0;}
    button{padding:10px; background:#16a34a; color:white; border:none;}
  </style>
</head>

<body>

<h2>Upload Dokumentasi RW 013</h2>

<p>Foto Lingkungan</p>
<input type="file" id="lingkungan" accept="image/*">

<p>Foto Kesehatan</p>
<input type="file" id="kesehatan" accept="image/*">

<p>Foto Sosial</p>
<input type="file" id="sosial" accept="image/*">

<p>Foto Keamanan</p>
<input type="file" id="keamanan" accept="image/*">

<p>Foto Bank Sampah</p>
<input type="file" id="banksampah" accept="image/*">

<br><br>
<button onclick="upload()">Upload Semua</button>

</body>
</html>
