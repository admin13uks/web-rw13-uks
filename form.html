<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dokumentasi RW 013</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:550px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  color:#16a34a;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{ opacity:.9; }

.btn-home{ background:#2563eb; }
.btn-cancel{ background:#dc2626; }
</style>
</head>

<body>

<div class="container">
  <h2>Upload Dokumentasi RW 013</h2>

  <label>Pilih Kategori</label>
  <select id="kategori">
    <option value="">-- Pilih Kategori --</option>
    <option value="lingkungan">Lingkungan</option>
    <option value="kesehatan">Kesehatan</option>
    <option value="sosial">Sosial</option>
    <option value="keamanan">Keamanan</option>
    <option value="kerohanian">Kerohanian</option>
    <option value="kegiatan">Foto Kegiatan</option>
  </select>

  <label>Judul</label>
  <input type="text" id="judul">

  <label>Keterangan</label>
  <textarea id="keterangan"></textarea>

  <label>Upload Foto</label>
  <input type="file" id="foto" accept="image/*" onchange="preview(this)">
  <img id="previewImg">

  <button id="btnUpload" onclick="simpan()">Simpan</button>
  <button class="btn-cancel" onclick="batal()">Batal</button>
  <button class="btn-home" onclick="beranda()">⬅ Kembali ke Beranda</button>
</div>

<script>
const GITHUB_TOKEN = "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";
const REPO = "admin13uks/rw13-uks";   // BENAR untuk upload
const BRANCH = "main";

/* ================= HAPUS FOTO LAMA ================= */
async function hapusFotoLama(folder){
  try{
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/uploads/${folder}?ref=${BRANCH}`,{
      headers:{ "Authorization": "token " + GITHUB_TOKEN }
    });

    const files = await res.json();
    if(!Array.isArray(files)) return;

    const images = files.filter(f =>
      f.type === "file" && f.name.match(/\.jpg$/i)
    );

    if(images.length <= 3) return;

    images.sort((a,b)=> b.name.localeCompare(a.name));
    const oldFiles = images.slice(3);

    for(const file of oldFiles){

      // ================= HAPUS GAMBAR =================
      await fetch(`https://api.github.com/repos/${REPO}/contents/${file.path}`,{
        method:"DELETE",
        headers:{
          "Authorization": "token " + GITHUB_TOKEN,
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          message: "Auto delete old image",
          sha: file.sha,
          branch: BRANCH
        })
      });

      // ================= HAPUS JSON PASANGAN =================
      const jsonPath = file.path.replace(".jpg",".json");

      const jsonFile = files.find(f => f.path === jsonPath);
      if(jsonFile){
        await fetch(`https://api.github.com/repos/${REPO}/contents/${jsonFile.path}`,{
          method:"DELETE",
          headers:{
            "Authorization": "token " + GITHUB_TOKEN,
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            message: "Auto delete json pair",
            sha: jsonFile.sha,
            branch: BRANCH
          })
        });
      }

      console.log("🗑 Deleted:", file.name);
    }

  }catch(err){
    console.error("Gagal hapus foto lama:", err);
  }
}

/* ================= PREVIEW ================= */
function preview(input){
  const file = input.files[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("File harus berupa gambar!");
    input.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("previewImg").src = e.target.result;
  }
  reader.readAsDataURL(file);
}

/* ================= BATAL ================= */
function batal(){
  if(confirm("Batalkan upload?")) location.reload();
}

/* ================= BERANDA ================= */
function beranda(){
  window.location.href = "index.html";
}

/* ================= RESIZE FOTO ================= */
function resizeImage(file, maxWidth = 1280, quality = 0.8){
  return new Promise(resolve=>{
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => img.src = e.target.result;
    reader.readAsDataURL(file);

    img.onload = ()=>{
      const canvas = document.createElement("canvas");
      let width = img.width;
      let height = img.height;

      if(width > maxWidth){
        height *= maxWidth / width;
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,width,height);

      canvas.toBlob(blob=>{
        const reader2 = new FileReader();
        reader2.onloadend = ()=> resolve(reader2.result.split(",")[1]);
        reader2.readAsDataURL(blob);
      },"image/jpeg",quality);
    }
  });
}

/* ================= SIMPAN ================= */
async function simpan(){

  const file = document.getElementById("foto").files[0];
  if(!file) return alert("Pilih foto dulu");

  const reader = new FileReader();

  reader.onload = async function(){
    const base64 = reader.result.split(",")[1];

    const res = await fetch("https://script.google.com/macros/s/AKfycbxq6mKbIY5eMhrnB_qyNGdvy9Njl66nLbZHl9lJDxK-2K8MZrE9irWTSCCzirHPqKdlkQ/exec", {
      method: "POST",
      body: JSON.stringify({
        base64: base64
      })
    });

    const result = await res.json();

    if(res.ok){
      alert("Upload berhasil");
      location.reload();
    }else{
      alert("Upload gagal");
    }
  }

  reader.readAsDataURL(file);
}

    // ================= RESIZE FOTO =================
    const base64 = await resizeImage(file);

    const timestamp = Date.now();
    const filename = timestamp + ".jpg";
    const jsonName = timestamp + ".json";

    const imgPath = `uploads/${kategori}/${filename}`;
    const jsonPath = `uploads/${kategori}/${jsonName}`;

    // ================= UPLOAD FOTO =================
  const uploadImg = await fetch(
  `https://api.github.com/repos/${REPO}/contents/${imgPath}`,
{
  method: "PUT",
  headers: {
    "Authorization": "token " + GITHUB_TOKEN,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    message: `Upload ${kategori} - ${judul}`,
    content: base64,
    branch: BRANCH
  })
});


    const imgResult = await uploadImg.json();
    if(!uploadImg.ok) throw new Error(imgResult.message);

    // ================= UPLOAD JSON =================
    const jsonContent = btoa(JSON.stringify({
      judul: judul,
      keterangan: keterangan,
      file: filename,
      tanggal: new Date().toISOString()
    }, null, 2));

    const uploadJson = await fetch(`https://api.github.com/repos/${REPO}/contents/${jsonPath}`, {
      method: "PUT",
      headers: {
        "Authorization": "token " + GITHUB_TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Upload data foto",
        content: jsonContent,
        branch: BRANCH
      })
    });

    const jsonResult = await uploadJson.json();
    if(!uploadJson.ok) throw new Error(jsonResult.message);

    // ================= HAPUS FOTO LAMA =================
    await hapusFotoLama(kategori);

    alert("✅ Upload berhasil!");
    window.location.href = kategori + ".html";

  }catch(err){
    console.error(err);
    alert("❌ Upload gagal: " + err.message);

    btn.innerText = "Simpan";
    btn.disabled = false;
  }
}

</script>

</body>
</html>
