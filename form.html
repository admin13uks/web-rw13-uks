<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RW 013 - Input Data</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:650px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  color:#16a34a;
}

.tab{
  display:flex;
  margin-bottom:20px;
}

.tab button{
  flex:1;
  padding:12px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.active{
  background:#16a34a;
  color:white;
}

.notactive{
  background:#e5e7eb;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

.rt-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hidden{ display:none; }

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}
.data-bg{
  background:#e0f2fe;
  padding:20px;
  border-radius:12px;
}
  
</style>
</head>

<body>

<div class="container">
<h2>RW 013 - Sistem Input</h2>

<div class="tab">
  <button id="btnUpload" class="active" onclick="showUpload()">Upload Dokumentasi</button>
  <button id="btnData" class="notactive" onclick="showData()">Input Data</button>
</div>

<!-- ================= UPLOAD DOKUMENTASI ================= -->
<div id="uploadSection">

<label>Pilih Kategori</label>
<select id="kategori">
  <option value="">-- Pilih Kategori --</option>
  <option value="lingkungan">Lingkungan</option>
  <option value="kesehatan">Kesehatan</option>
  <option value="sosial">Sosial</option>
  <option value="keamanan">Keamanan</option>
  <option value="kerohanian">Kerohanian</option>
  <option value="informasi">Informasi</option>
</select>

<label>Judul</label>
<input type="text" id="judul">

<label>Keterangan</label>
<textarea id="keteranganUpload"></textarea>

<label>Upload Foto</label>
<input type="file" id="foto" accept="image/*" onchange="preview(this)">
<img id="previewImg">

<button onclick="simpanUpload()">Simpan Dokumentasi</button>

</div>

<!-- ================= INPUT DATA ================= -->
<div id="dataSection" class="hidden data-bg">

<label>Jenis Data</label>
<select id="jenisData" onchange="cekJenis()">
  <option value="">-- Pilih Jenis --</option>
  <option value="Pengaspalan Jalan">Pengaspalan Jalan</option>
  <option value="Lampu Jalan">Lampu Jalan</option>
  <option value="Perbaikan Saluran">Perbaikan Saluran</option>
  <option value="lainnya">Lainnya (Isi Manual)</option>
</select>

<input type="text" id="jenisManual" placeholder="Tulis jenis data disini..." class="hidden">

<label>Keterangan</label>
<textarea id="keteranganData"></textarea>

<label>Pilih RT yang Diproses</label>
<div class="rt-list" id="rtContainer"></div>

<label>Jumlah RT</label>
<input type="text" id="jumlahRT" readonly>

<label>Tahun</label>
<input type="text" id="tahun" readonly>

<button onclick="simpanData()">Simpan Data</button>

</div>

</div>

<script>

// ================= TAB SWITCH =================
function showUpload(){
  uploadSection.classList.remove("hidden");
  dataSection.classList.add("hidden");
  btnUpload.classList.add("active");
  btnData.classList.remove("active");
}

function showData(){
  uploadSection.classList.add("hidden");
  dataSection.classList.remove("hidden");
  btnUpload.classList.remove("active");
  btnData.classList.add("active");
}

// ================= AUTO GENERATE RT =================
const rtContainer = document.getElementById("rtContainer");
for(let i=1;i<=17;i++){
  const label = document.createElement("label");
  label.innerHTML = `
    <input type="checkbox" value="RT ${String(i).padStart(3,'0')}" onchange="hitungRT()"> 
    RT ${String(i).padStart(3,'0')}
  `;
  rtContainer.appendChild(label);
}

// ================= HITUNG JUMLAH RT =================
function hitungRT(){
  const checked = document.querySelectorAll("#rtContainer input:checked");
  document.getElementById("jumlahRT").value = checked.length + " RT";
}

// ================= SET TAHUN OTOMATIS =================
document.getElementById("tahun").value = new Date().getFullYear();

// ================= UPLOAD DOKUMENTASI =================
function preview(input){
  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e => previewImg.src = e.target.result;
  reader.readAsDataURL(file);
}

async function simpanUpload(){
  alert("Upload Dokumentasi tetap menggunakan sistem lama Anda");
}

function cekJenis(){
  const jenis = document.getElementById("jenisData").value;
  const manual = document.getElementById("jenisManual");

  if(jenis === "lainnya"){
    manual.classList.remove("hidden");
  }else{
    manual.classList.add("hidden");
  }
}
  
// ================= SIMPAN DATA =================
async function simpanData(){

  let jenis = document.getElementById("jenisData").value;
  const manual = document.getElementById("jenisManual").value;

  if(jenis === "lainnya"){
    if(!manual) return alert("Isi jenis data terlebih dahulu");
    jenis = manual;
  }

  const keterangan = document.getElementById("keteranganData").value;
  const tahun = document.getElementById("tahun").value;
  const rtDipilih = [...document.querySelectorAll("#rtContainer input:checked")]
                      .map(cb => cb.value);

  if(!jenis) return alert("Pilih jenis data dulu");
  if(rtDipilih.length === 0) return alert("Pilih minimal 1 RT");

  try{

    const res = await fetch("https://script.google.com/macros/s/AKfycbxjrUGEqDQF-aaSHxfpQOjhsqsIp9IvkpfnWDqslY4RRD1WKp0ivDqdluz0Y63m27kT/exec", {
      method: "POST",
      body: JSON.stringify({
        tipe: "dataLingkungan",
        jenis,
        keterangan,
        jumlahRT: rtDipilih.length,
        rt: rtDipilih.join(", "),
        tahun
      })
    });

    if(res.ok){
      alert("✅ Data berhasil disimpan");
      location.reload();
    }else{
      alert("❌ Gagal menyimpan data");
    }

  }catch(err){
    alert("❌ Server tidak terhubung");
  }

}

</script>

</body>
</html>
