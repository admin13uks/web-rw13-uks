<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dokumentasi RW 013</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:550px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

h2{
  text-align:center;
  color:#16a34a;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn-home{
  background:#2563eb;
}

.btn-home:hover{
  background:#1d4ed8;
}
</style>
</head>
<body>

<div class="container">
  <h2>Upload Dokumentasi RW 013</h2>

  <label>Pilih Kategori</label>
  <select id="kategori">
    <option value="">-- Pilih Kategori --</option>
    <option value="lingkungan">Lingkungan</option>
    <option value="kesehatan">Kesehatan</option>
    <option value="sosial">Sosial</option>
    <option value="keamanan">Keamanan</option>
    <option value="banksampah">Bank Sampah</option>
    <option value="kegiatan">Foto Kegiatan</option>
  </select>

  <label>Judul</label>
  <input type="text" id="judul">

  <label>Keterangan</label>
  <textarea id="keterangan"></textarea>

  <label>Upload Foto</label>
  <input type="file" id="foto" accept="image/*" onchange="preview(this)">
  <img id="previewImg">

  <button onclick="simpan()">Simpan</button>
  <button onclick="batal()" style="background:#dc2626;">Batal</button>

  <!-- TOMBOL BERANDA -->
  <button class="btn-home" onclick="beranda()">⬅ Kembali ke Beranda</button>

</div>

<script>
const GITHUB_TOKEN = "ISI_TOKEN_GITHUB_KAMU";
const REPO = "admin13uks/rw13-uks";
const BRANCH = "main";

/* ================= PREVIEW ================= */
function preview(input){
  const file = input.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById("previewImg").src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

/* ================= BATAL ================= */
function batal(){
  if(confirm("Batalkan upload?")){
    location.reload();
  }
}

/* ================= BERANDA ================= */
function beranda(){
  window.location.href = "index.html";
}

/* ================= SIMPAN ================= */
async function simpan(){

  const btn = document.querySelector("button");
  btn.innerText = "Mengupload...";
  btn.disabled = true;

  const kategori = document.getElementById("kategori").value;
  const judul = document.getElementById("judul").value;
  const keterangan = document.getElementById("keterangan").value;
  const file = document.getElementById("foto").files[0];

  if(!kategori || !judul || !keterangan || !file){
    alert("Semua field harus diisi!");
    btn.innerText = "Simpan";
    btn.disabled = false;
    return;
  }

  // Maksimal 1.5MB
if(file.size > 1.5 * 1024 * 1024){
  alert("Ukuran foto terlalu besar!\nMaksimal 1.5MB");
  btn.innerText = "Simpan";
  btn.disabled = false;
  return;
}

  try{

    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = async () => {

      const base64 = reader.result.split(",")[1];
      const filename = Date.now() + "_" + file.name;
      const path = `uploads/${kategori}/${filename}`;

      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
        method: "PUT",
        headers: {
          "Authorization": "token " + GITHUB_TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Upload foto dokumentasi",
          content: base64,
          branch: BRANCH
        })
      });

      const data = await res.json();

      if(!res.ok){
        throw new Error(data.message || "Upload gagal");
      }

      alert("✅ Upload berhasil");
      window.location.href = kategori + ".html";
    };

  }catch(err){
    alert("❌ Error: " + err.message);
    btn.innerText = "Simpan";
    btn.disabled = false;
  }
  
}
</script>

</body>
</html>
