<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dokumentasi RW 013</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:550px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  color:#16a34a;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{ opacity:.9; }

.btn-home{ background:#2563eb; }
.btn-cancel{ background:#dc2626; }
</style>
</head>

<body>

<div class="container">
  <h2>Upload Dokumentasi RW 013</h2>

  <label>Pilih Kategori</label>
  <select id="kategori">
    <option value="">-- Pilih Kategori --</option>
    <option value="lingkungan">Lingkungan</option>
    <option value="kesehatan">Kesehatan</option>
    <option value="sosial">Sosial</option>
    <option value="keamanan">Keamanan</option>
    <option value="kerohanian">Kerohanian</option>
    <option value="kegiatan">Kegiatan</option>
    <option value="informasi">Informasi</option>
  </select>

  <label>Judul</label>
  <input type="text" id="judul">

  <label>Keterangan</label>
  <textarea id="keterangan"></textarea>

  <label>Upload Foto</label>
  <input type="file" id="foto" accept="image/*" onchange="preview(this)">
  <img id="previewImg">

  <button onclick="simpan()">Simpan</button>
  <button class="btn-cancel" onclick="location.reload()">Batal</button>
  <button class="btn-home" onclick="window.location.href='index.html'">⬅ Kembali</button>
</div>

<script>

function preview(input){
  const file = input.files[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("File harus berupa gambar!");
    input.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("previewImg").src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function simpan(){

  const kategori = document.getElementById("kategori").value;
  const judul = document.getElementById("judul").value;
  const keterangan = document.getElementById("keterangan").value;
  const file = document.getElementById("foto").files[0];

  if(!kategori) return alert("Pilih kategori dulu");
  if(!judul) return alert("Isi judul dulu");
  if(!file) return alert("Pilih foto dulu");

  const reader = new FileReader();

  reader.onload = async function(){
    const base64 = reader.result.split(",")[1];

    try{

      const res = await fetch("https://script.google.com/macros/s/AKfycbxjrUGEqDQF-aaSHxfpQOjhsqsIp9IvkpfnWDqslY4RRD1WKp0ivDqdluz0Y63m27kT/exec", {
        method: "POST",
        body: JSON.stringify({
  tipe: "uploadDokumentasi",
  kategori: kategori,
  judul: judul,
  keterangan: keterangan,
  fileData: base64,
  fileName: file.name,
  mimeType: file.type
})
});
      const result = await res.json();

      if(res.ok){
        alert("✅ Upload berhasil");
        window.location.href = kategori + ".html";
      }else{
        alert("❌ Upload gagal: " + result.message);
      }

    }catch(err){
      alert("❌ Tidak bisa terhubung ke server");
      console.error(err);
    }
  };

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
