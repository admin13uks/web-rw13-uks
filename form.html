
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Upload RW 013</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.header{
  background:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.header span{
  font-size:14px;
  font-weight:bold;
  color:#16a34a;
}

.logout{
  background:#ef4444;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

.container{
  max-width:500px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#16a34a;
}

label{
  font-weight:bold;
  display:block;
  margin-top:15px;
  font-size:14px;
}

input{
  width:100%;
  margin-top:5px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

img{
  margin-top:10px;
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
}

button.upload{
  margin-top:25px;
  padding:14px;
  width:100%;
  background:#16a34a;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

button.upload:hover{
  background:#15803d;
}

/* Responsive HP lebih kecil */
@media(max-width:480px){
  .container{
    margin:10px;
    padding:15px;
  }

  h2{
    font-size:18px;
  }
}
</style>
</head>
<body>

<div class="header">
  <span id="userEmail"></span>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">
  <h2>Form Upload Foto</h2>

  <label>Foto Lingkungan</label>
  <input type="file" id="lingkungan" accept="image/*" capture="environment" onchange="preview(this,'p1')">
  <img id="p1">

  <label>Foto Kesehatan</label>
  <input type="file" id="kesehatan" accept="image/*" capture="environment" onchange="preview(this,'p2')">
  <img id="p2">

  <label>Foto Sosial</label>
  <input type="file" id="sosial" accept="image/*" capture="environment" onchange="preview(this,'p3')">
  <img id="p3">

  <label>Foto Keamanan</label>
  <input type="file" id="keamanan" accept="image/*" capture="environment" onchange="preview(this,'p4')">
  <img id="p4">

  <label>Foto Bank Sampah</label>
  <input type="file" id="banksampah" accept="image/*" capture="environment" onchange="preview(this,'p5')">
  <img id="p5">

  <button class="upload" onclick="simpan()">Simpan</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5XkibU-ei072xcQ4ZN4D4tK-PVRrxucA",
  authDomain: "rw13-uks.firebaseapp.com",
  projectId: "rw13-uks",
  storageBucket: "rw13-uks.firebasestorage.app",
  messagingSenderId: "500710465344",
  appId: "1:500710465344:web:eb1c89900edfd5925924a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("userEmail").innerText = "Login: " + user.email;
  } else {
    window.location.href = "login.html";
  }
});

window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href="login.html";
  });
}

window.preview = function(input, target){
  const file = input.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById(target).src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

window.simpan = function(){
  alert("Foto siap diupload ke Firebase Storage");
}
</script>

</body>
</html>
