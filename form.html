<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dokumentasi RW 013</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:550px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  color:#16a34a;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

  .tabs{
  display:flex;
  margin-bottom:20px;
  gap:5px;
}

.tab-btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#e5e7eb;
  cursor:pointer;
  font-weight:bold;
}

.tab-btn.active{
  background:#16a34a;
  color:white;
}

button:hover{ opacity:.9; }

.btn-home{ background:#2563eb; }
.btn-cancel{ background:#dc2626; }
</style>
</head>

<body>

<div class="container">

  <h2>Form RW 013</h2>

  <!-- MENU TAB -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('lingkungan')">Input Data Lingkungan</button>
    <button class="tab-btn" onclick="showTab('upload')">Upload Dokumentasi</button>
  </div>

  <!-- ========================= -->
  <!-- FORM DATA LINGKUNGAN -->
  <!-- ========================= -->
  <div id="lingkungan" class="tab-content">

    <label>Jenis Kegiatan</label>
    <input type="text" id="jenis" placeholder="Contoh: Paving Block">

    <label>Keterangan</label>
    <textarea id="ketLingkungan"></textarea>

    <label>RT</label>
    <input type="text" id="rt">

    <label>Tahun</label>
    <input type="number" id="tahunLingkungan" value="2026">

    <button onclick="simpanLingkungan()">Simpan Data Lingkungan</button>

<button class="btn-home" onclick="goHome()">⬅ Kembali ke Beranda</button>
    
  </div>

  <!-- ========================= -->
  <!-- FORM UPLOAD -->
  <!-- ========================= -->
  <div id="upload" class="tab-content" style="display:none;">

    <label>Pilih Kategori</label>
    <select id="kategori">
      <option value="">-- Pilih Kategori --</option>
      <option value="lingkungan">Lingkungan</option>
      <option value="kesehatan">Kesehatan</option>
      <option value="sosial">Sosial</option>
      <option value="keamanan">Keamanan</option>
      <option value="kerohanian">Kerohanian</option>
      <option value="informasi">Informasi</option>
    </select>

    <label>Judul</label>
    <input type="text" id="judul">

    <label>Keterangan</label>
    <textarea id="keterangan"></textarea>

    <label>Upload Foto</label>
    <input type="file" id="foto" accept="image/*" onchange="preview(this)">
    <img id="previewImg">

    <button onclick="simpan()">Simpan</button>
    <button class="btn-cancel" onclick="location.reload()">Batal</button>
    <button class="btn-home" onclick="window.location.href='index.html'">⬅ Kembali</button>

  </div>

</div>
<script>

function preview(input){
  const file = input.files[0];
  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("File harus berupa gambar!");
    input.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("previewImg").src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function simpan(){

  const kategori = document.getElementById("kategori").value;
  const judul = document.getElementById("judul").value;
  const keterangan = document.getElementById("keterangan").value;
  const file = document.getElementById("foto").files[0];

  if(!kategori) return alert("Pilih kategori dulu");
  if(!judul) return alert("Isi judul dulu");
  if(!file) return alert("Pilih foto dulu");

  const reader = new FileReader();

  reader.onload = async function(){
    const base64 = reader.result.split(",")[1];

    try{

      const res = await fetch("https://script.google.com/macros/s/AKfycbxjrUGEqDQF-aaSHxfpQOjhsqsIp9IvkpfnWDqslY4RRD1WKp0ivDqdluz0Y63m27kT/exec", {
        method: "POST",
        body: JSON.stringify({
          kategori,
          judul,
          keterangan,
          base64
        })
      });

const text = await res.text();
console.log(text);
alert("✅ Data berhasil disimpan");
      
      if(res.ok){
        alert("✅ Upload berhasil");
        window.location.href = kategori + ".html";
      }else{
        alert("❌ Upload gagal");
      }

    }catch(err){
      alert("❌ Tidak bisa terhubung ke server");
      console.error(err);
    }
  };

  reader.readAsDataURL(file);
}

async function simpanLingkungan(){

  const jenis = document.getElementById("jenis").value.trim();
  const keterangan = document.getElementById("ketLingkungan").value;
  const rt = document.getElementById("rt").value.trim();
  const tahun = document.getElementById("tahunLingkungan").value;

  if(!jenis) return alert("Isi jenis kegiatan dulu");
  if(!rt) return alert("Isi RT dulu");

  try{

    const formData = new FormData();

    formData.append("tipe","dataLingkungan");
    formData.append("jenis",jenis);
    formData.append("keterangan",keterangan);
    formData.append("rt",rt);
    formData.append("tahun",tahun);

    const res = await fetch("https://script.google.com/macros/s/AKfycbxJz4NvNYK111g51V8BO9aJmvr4J2fLnfUBUoUYnVqX417HkIToU1WsG5u3vMGGD1cV/exec",{
      method:"POST",
      body:formData
    });

    const text = await res.text();

    console.log("RESPON:", text);

    alert("✅ Data berhasil disimpan");

    document.getElementById("jenis").value="";
    document.getElementById("ketLingkungan").value="";
    document.getElementById("rt").value="";

  }catch(err){

    alert("❌ Tidak bisa terhubung ke server");
    console.error(err);

  }
}

function showTab(tabId){

  document.getElementById("lingkungan").style.display = "none";
  document.getElementById("upload").style.display = "none";

  document.getElementById(tabId).style.display = "block";

  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach(btn => btn.classList.remove("active"));

  event.target.classList.add("active");
}

function goHome(){
  window.location.href = "index.html";
}
  
</script>

</body>
</html>
