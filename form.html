<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Dokumentasi RW 013</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.container{
  max-width:550px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

h2{
  text-align:center;
  color:#16a34a;
}

label{
  font-weight:bold;
  margin-top:15px;
  display:block;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

textarea{
  resize:none;
  height:80px;
}

img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

button{
  margin-top:20px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
  <h2>Upload Dokumentasi RW 013</h2>

  <label>Pilih Kategori</label>
  <select id="kategori">
    <option value="">-- Pilih Kategori --</option>
    <option value="lingkungan">Lingkungan</option>
    <option value="kesehatan">Kesehatan</option>
    <option value="sosial">Sosial</option>
    <option value="keamanan">Keamanan</option>
    <option value="banksampah">Bank Sampah</option>
    <option value="kegiatan">Foto Kegiatan</option>
  </select>

  <label>Judul</label>
  <input type="text" id="judul">

  <label>Keterangan</label>
  <textarea id="keterangan"></textarea>

  <label>Upload Foto</label>
  <input type="file" id="foto" accept="image/*" onchange="preview(this)">
  <img id="previewImg">

  <button onclick="simpan()">Simpan</button>
<button onclick="batal()" style="background:#dc2626;margin-top:10px;">Batal</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getStorage, ref, uploadBytes, getDownloadURL 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { 
  getFirestore, collection, addDoc, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5XkibU-ei072xcQ4ZN4D4tK-PVRrxucA",
  authDomain: "rw13-uks.firebaseapp.com",
  projectId: "rw13-uks",
  storageBucket: "rw13-uks.firebasestorage.app",
  messagingSenderId: "500710465344",
  appId: "1:500710465344:web:eb1c89900edfd5925924a5"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getFirestore(app);

window.preview = function(input){
  const file = input.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById("previewImg").src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

window.batal = function(){
  if(confirm("Batalkan upload?")){
    location.reload();
  }
}

window.simpan = async function(){

  const btn = document.querySelector("button");
  btn.innerText = "Mengupload...";
  btn.disabled = true;

  const kategori = document.getElementById("kategori").value;
  const judul = document.getElementById("judul").value;
  const keterangan = document.getElementById("keterangan").value;
  const file = document.getElementById("foto").files[0];

  if(!kategori || !judul || !keterangan || !file){
    alert("Semua field harus diisi!");
    btn.innerText = "Simpan";
    btn.disabled = false;
    return;
  }

  try{

    const storageRef = ref(storage, kategori + "/" + Date.now() + "_" + file.name);
    await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(storageRef);

    await addDoc(collection(db, kategori), {
      judul: judul,
      keterangan: keterangan,
      imageUrl: downloadURL,
      createdAt: serverTimestamp()
    });

    // Kirim ke halaman tujuan
    localStorage.setItem("fotoTerakhir", downloadURL);
    localStorage.setItem("judulTerakhir", judul);
    localStorage.setItem("ketTerakhir", keterangan);

    alert("✅ Foto berhasil disimpan");

    window.location.href = kategori + ".html";

  }catch(error){
    alert("❌ Upload gagal: " + error.message);
    btn.innerText = "Simpan";
    btn.disabled = false;
  }
}

</script>

</body>
</html>
