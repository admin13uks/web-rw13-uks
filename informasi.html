<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kegiatan Warga | RW 013 Utan Kayu Selatan</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Plus Jakarta Sans', sans-serif;
}

body{
  background:#f9fafb;
  color:#1f2937;
  padding-top:80px;
}

/* ================= HEADER ================= */
.site-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  z-index:9999;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-weight:800;
  font-size:18px;
  color:#16a34a;
  text-decoration:none;
}

.nav-menu ul{
  display:flex;
  list-style:none;
  gap:24px;
}

.nav-menu a{
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  color:#374151;
}

.nav-menu a.active,
.nav-menu a:hover{
  color:#16a34a;
}

/* ================= HAMBURGER ================= */
.hamburger{
  display:none;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
}

.hamburger span{
  width:26px;
  height:3px;
  background:#16a34a;
  border-radius:2px;
}

/* ================= MOBILE MENU ================= */
@media(max-width:768px){
  .hamburger{display:flex;}

  .nav-menu{
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    background:#fff;
    display:none;
    padding:20px;
    border-bottom:1px solid #e5e7eb;
  }

  .nav-menu.active{
    display:block;
  }

  .nav-menu ul{
    flex-direction:column;
    gap:14px;
  }
}

/* ================= HERO ================= */
.kegiatan-hero{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  padding:120px 20px 80px;
  text-align:center;
  color:#fff;
}

.kegiatan-hero h1{
  font-size:40px;
  font-weight:800;
}

.kegiatan-hero p{
  max-width:720px;
  margin:12px auto 0;
  font-size:16px;
  opacity:.95;
}

/* ================= CONTAINER ================= */
.container{
  max-width:1200px;
  margin:auto;
  padding:60px 20px;
}

/* ================= CARD ================= */
.kegiatan-card{
  background:#fff;
  border-radius:24px;
  margin-bottom:60px;
  box-shadow:0 25px 45px rgba(0,0,0,.08);
  overflow:hidden;
  transition:.3s ease;
}

.kegiatan-card:hover{
  transform:translateY(-6px);
}

/* ================= INFO ================= */
.kegiatan-info{
  padding:32px;
}

.kegiatan-info h2{
  color:#16a34a;
  font-weight:800;
  margin-bottom:6px;
}

.kegiatan-meta{
  font-size:14px;
  color:#6b7280;
  margin-bottom:14px;
}

.kegiatan-info p{
  line-height:1.7;
  color:#374151;
}

/* ================= GALLERY ================= */
.kegiatan-gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  padding:0 32px 32px;
}

.kegiatan-gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:16px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
  .kegiatan-hero h1{
    font-size:28px;
  }

  .kegiatan-gallery{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">RW 013 UKS</a>

    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html">Beranda</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="kegiatan-hero">
  <h1>Kegiatan Warga RW 013</h1>
  <p>
    Berbagai aktivitas sosial, kesehatan, dan kebersamaan warga
    sebagai wujud kepedulian dan gotong royong di lingkungan RW 013.
  </p>
</section>

<!-- ================= ISI ================= -->
<div class="container" id="listKegiatan"></div>
<!-- ================= SCRIPT ================= -->

  <script>
const USER = "admin13uks";
const REPO = "rw13-uks";
const FOLDER = "uploads/kegiatan";
const BRANCH = "main";

async function loadGalleryKegiatan(){
  try{
    const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
    const res = await fetch(url);
    const files = await res.json();
    if(!Array.isArray(files)) return;

    const images = files
      .filter(f => f.type === "file" && f.name.match(/\.(jpg|jpeg|png|webp)$/i))
      .sort((a,b)=> b.name.localeCompare(a.name))
      .slice(0,5); // maksimal 5 kegiatan

    const container = document.getElementById("listKegiatan");
    container.innerHTML = "";

    for(const file of images){

      const jsonUrl = file.download_url.replace(/\.(jpg|jpeg|png|webp)$/i,".json");

      let judul = "Kegiatan Warga";
      let ket = "";
      let tanggal = "";

      try{
        const jsonRes = await fetch(jsonUrl);
        if(jsonRes.ok){
          const data = await jsonRes.json();
          judul = data.judul || judul;
          ket = data.keterangan || "";
          tanggal = data.tanggal || "";
        }
      }catch(e){}

      const card = document.createElement("div");
      card.className = "kegiatan-card";

      card.innerHTML = `
        <div class="kegiatan-gallery">
          <img src="${file.download_url}" alt="${judul}">
        </div>
        <div class="kegiatan-info">
          <h2>${judul}</h2>
          <div class="kegiatan-meta">${tanggal}</div>
          <p>${ket}</p>
        </div>
      `;

      container.appendChild(card);
    }

  }catch(err){
    console.error(err);
  }
}

loadGalleryKegiatan();
setInterval(loadGalleryKegiatan, 30000);
</script>

</body>
</html>
