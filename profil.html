<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil RW 013 - Struktur & Bidang Kerja</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ========== RESET ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}

body {
  padding-top: 110px;
  background: #fcfcfc;
  color: #333;
}

/* ========== HEADER ========== */
.site-header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(0,0,0,.08);
  z-index: 10000;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* LOGO */
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.logo img { height: 45px; }
.logo-title { font-weight: 800; color: #16a34a; font-size: 18px; }
.logo-subtitle { font-size: 12px; color: #6b7280; }

/* ========== NAV ========== */
.nav-menu ul {
  list-style: none;
  display: flex;
  gap: 24px;
  align-items: center;
}

.nav-menu a {
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  color: #374151;
}
.nav-menu a:hover { color: #16a34a; }

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
}
.hamburger span {
  width: 25px;
  height: 3px;
  background: #333;
}

/* ========== DROPDOWN & MEGA MENU ========== */
.dropdown { position: relative; }

/* ===== MEGA MENU PROFIL (FIXED & CENTER) ===== */
.mega-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 720px;
  background: #fff;
  padding: 40px;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,.15);
  z-index: 9999;
}

.mega-menu.show {
  display: block;
}

.mega-wrapper {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px;
}

.mega-item {
  text-align: center;
  padding: 25px;
  border-radius: 14px;
  text-decoration: none;
  transition: .25s ease;
}

.mega-item:hover {
  background: #fff7ed;
  transform: translateY(-4px);
}
.mega-icon {
  width: 60px;
  height: 60px;
  background: #f97316;
  color: #fff;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 15px;
  font-size: 22px;
}
.mega-title { font-weight: 800; color: #111; }
.mega-desc { font-size: 13px; color: #6b7280; }

/* Dropdown biasa (Layanan) */
.dropdown-menu {
  display: none;
  position: absolute;
  top: 140%;
  left: 0;
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,.15);
}
.dropdown-menu.show { display: block; }
.dropdown-menu li { margin: 5px 0; }

/* ========== STRUKTUR ORGANISASI ========== */
.org-wrapper { background: #fff; padding: 60px 0; overflow-x: auto; }
.org-container { min-width: 1100px; text-align: center; margin: auto; }

.page-title {
  font-size: 32px;
  color: #2fa56a;
  margin-bottom: 50px;
  position: relative;
  display: inline-block;
}
.page-title::after {
  content: '';
  width: 60px;
  height: 4px;
  background: #ff6b00;
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 2px;
}

/* Tree */
.tree ul { display: flex; justify-content: center; padding-top: 20px; }
.tree li { list-style: none; position: relative; padding: 20px 5px 0; }

.tree li::before, .tree li::after {
  content: '';
  position: absolute;
  top: 0;
  width: 50%;
  height: 20px;
  border-top: 2px solid #ccc;
}
.tree li::before { right: 50%; }
.tree li::after {
  left: 50%;
  border-left: 2px solid #ccc;
}

.tree ul ul::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  border-left: 2px solid #ccc;
  height: 20px;
}

/* Card */
.card {
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  min-width: 150px;
  border: 1px solid #ddd;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}
.card.chairman { border: 2px solid #ff6b00; background: #fff9f5; }
.card.vice-chairman { border: 2px solid #2fa56a; background: #f0fdf4; }
.card.sie-box { border: 1.5px solid #2fa56a; }

.role {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.name { font-size: 13px; font-weight: 700; }

/* ========== BIDANG ========== */
.bidang-section {
  max-width: 1100px;
  margin: 60px auto 100px;
  padding: 0 20px;
}
.bidang-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
  gap: 25px;
}
.bidang-item {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  border-top: 5px solid #2fa56a;
  box-shadow: 0 10px 25px rgba(0,0,0,.05);
}
.bidang-item ul { list-style: none; }
.bidang-item li { padding-left: 20px; position: relative; margin-bottom: 10px; }
.bidang-item li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: #ff6b00;
}

/* ========== MOBILE ========== */
@media (max-width:768px) {
  .hamburger { display: flex; }

  .nav-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #fff;
    padding: 20px;
  }

  .nav-menu.active { display: block; }

  .nav-menu ul {
    flex-direction: column;
    align-items: flex-start;
  }

  /* PERBAIKAN */
  .mega-menu {
    position: static;
    transform: none;
    width: 100%;
    box-shadow: none;
    padding: 20px;
  }

  .mega-wrapper {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="https://raw.githubusercontent.com/admin13uks/web-rw13-uks/main/logo-13.png">
      <div>
        <div class="logo-title">RW 013 UKS</div>
        <div class="logo-subtitle">Utan Kayu Selatan – Matraman</div>
      </div>
    </a>

    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>

    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html">Beranda</a></li>

        <li class="dropdown">
          <a href="#" class="dropdown-toggle">Layanan ▾</a>
          <ul class="dropdown-menu">
            <li><a href="#">Administrasi</a></li>
            <li><a href="#">Lingkungan</a></li>
            <li><a href="#">Kesehatan</a></li>
            <li><a href="#">Keamanan</a></li>
          </ul>
        </li>

        <li><a href="#">Kegiatan</a></li>
        <li><a href="#">Kontak</a></li>
      </ul>
    </nav>

  </div>
</header>

<!-- ================= JS ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const hamburger = document.getElementById("hamburger");
  const navMenu = document.getElementById("navMenu");

  hamburger.addEventListener("click", () => {
    navMenu.classList.toggle("active");
  });

  document.querySelectorAll(".dropdown-toggle").forEach(toggle => {
    toggle.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      const menu = toggle.nextElementSibling;
      document.querySelectorAll(".dropdown-menu").forEach(d => {
        if (d !== menu) d.classList.remove("show");
      });
      menu.classList.toggle("show");
    });
  });

document.addEventListener("click", () => {
  document.querySelectorAll(".dropdown-menu, .mega-menu")
    .forEach(d => d.classList.remove("show"));
  navMenu.classList.remove("active");
});

});
</script>

</body>
</html>
